[project]
name = "jev-judge-bench"
version = "0.1.0"
description = "Native Jev versus direct structured output and schema-guided reasoning"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.23,<5", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "python-dotenv>=1,<2"]

[project.scripts]
judge-bench = "judge_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
extend-exclude = [".uv-cache", ".venv", "data", "runs", "docs/sources"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/judge_bench"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "config", "docs/methodology.md", "docs/tabfact-sgr.md", "scripts"]
